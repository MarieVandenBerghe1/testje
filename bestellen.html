<!DOCTYPE html>
<html lang="nl-be">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De President - Bestellen</title>

    <link rel="stylesheet" href="style.css">


</head>

<body class="page-bestellen">

    <header>
        <img src="image/foto_President.png" class="logo">
    </header>

    <div class="topnav">
        <a href="index.html">Home</a>
        <a class="active" href="bestellen.html">Bestellen</a>
        <a href="contact.html">Contact</a>
    </div>

    <main class="bestellen-page">

        <section id="broodjesSectie">
            <h2>Menu</h2>
            <div id="categorieFilters"></div>
            <div id="broodjesContainer" class="broodjes-container"></div>
        </section>

        <section id="winkelmandjeSectie">
            <h2>Winkelmandje</h2>

            <ul id="orderList"></ul>
            <p>Totaal: €<span id="total">0.00</span></p>

            <div class="order-box">
                <input type="text" id="customerName" placeholder="Naam">
                <button class="order-btn" onclick="placeOrder()">Bestellen</button>
            </div>
        </section>

    </main>

    <div class="overlay" id="overlay" onclick="closePopup()"></div>

    <div class="popup" id="popup">

        <h3 id="popupBroodjeNaam"></h3>

        <label>Broodtype</label>
        <select id="popupBroodType">
            <option value="Wit">Wit</option>
            <option value="Bruin">Bruin (+€0,50)</option>
        </select>

        <div class="popup-content">

            <div class="popup-column" id="popupGroentenContainer">
                <strong>Groenten</strong>
            </div>

            <div class="popup-column" id="popupSauzenContainer">
                <strong>Sauzen</strong>
            </div>

        </div>

        <label>Opmerking</label>
        <input type="text" id="popupOpmerking">

        <br><br>

        <button onclick="addPopupToCart()">Toevoegen</button>

    </div>

    <script>

        let selectedCategorie = "all";
        let totalPrice = 0;
        let currentBroodje = null;

        let categorieenData = [];
        let broodjesData = [];
        let extrasData = [];
        let sauzenData = [];

        window.onload = function () {

            //laad alle broodjes
            fetch("http://localhost:3000/broodjes")
                .then(r => r.json())
                .then(data => {

                    console.log("BROODJES GELOAD:", data[0]);

                    broodjesData = data;

                    renderBroodjes();
                });

            //laad de extras, sauzen en categorieen
            fetch("http://localhost:3000/extras")
                .then(r => r.json())
                .then(data => extrasData = Array.isArray(data) ? data : []);

            fetch("http://localhost:3000/sauzen")
                .then(r => r.json())
                .then(data => sauzenData = Array.isArray(data) ? data : []);

            fetch("http://localhost:3000/categorieen")
                .then(r => r.json())
                .then(data => {
                    const container = document.getElementById("categorieFilters");

                    container.innerHTML = `<button class="cat-btn" onclick="filterCategorie('all')">Alles</button>`;

                    data.forEach(c => {
                        container.innerHTML += `
                        <button class="cat-btn" onclick="filterCategorie('${c.id}')">
                        ${c.naam}
                        </button>`;
                    });
                });
        };

        //dit zorgt ervoor dat als je een categorie kiest je die broodjes krijgt
        function filterCategorie(id) {
            selectedCategorie = id;
            renderBroodjes();
        }

        //als je een broodje besteld opent de popup
        function openPopup(button) {

            currentBroodje = button.closest(".broodje");

            document.getElementById("popupBroodjeNaam").innerText =
                currentBroodje.dataset.naam;

            document.getElementById("popupBroodType").value = "Wit";
            document.getElementById("popupOpmerking").value = "";

            const g = document.getElementById("popupGroentenContainer");
            const s = document.getElementById("popupSauzenContainer");

            g.innerHTML = "<strong>Groenten</strong>";
            s.innerHTML = "<strong>Sauzen</strong>";

            extrasData.forEach(item => {
                const prijs = parseFloat(item.prijs || 0);

                g.innerHTML += `
            <label>
                <input type="checkbox" class="popupGroenten" data-prijs="${prijs}">
                <span>${item.naam}${prijs ? ` (+€${prijs.toFixed(2)})` : ""}</span>
            </label>`;
            });

            sauzenData.forEach(item => {
                const prijs = parseFloat(item.prijs || 0);

                s.innerHTML += `
            <label>
                <input type="checkbox" class="popupSaus" data-prijs="${prijs}">
                <span>${item.naam}${prijs ? ` (+€${prijs.toFixed(2)})` : ""}</span>
            </label>`;
            });

            document.getElementById("overlay").style.display = "block";
            document.getElementById("popup").style.display = "block";
        }

        //functie voor in het winkelmandje te zetten
        function addPopupToCart() {

            let prijs = parseFloat(currentBroodje.dataset.prijs);
            let naam = currentBroodje.dataset.naam;
            let id = currentBroodje.dataset.id;

            let groenten = [];
            let sauzen = [];

            let opmerking = document.getElementById("popupOpmerking").value.trim();

            if (document.getElementById("popupBroodType").value === "Bruin") {
                prijs += 0.5;
            }

            let extraInfo = {
                groenten,
                sauzen,
                opmerking
            };

            document.querySelectorAll(".popupGroenten:checked").forEach(g => {
                prijs += parseFloat(g.dataset.prijs || 0);
                groenten.push(g.nextElementSibling.innerText);
            });

            document.querySelectorAll(".popupSaus:checked").forEach(s => {
                prijs += parseFloat(s.dataset.prijs || 0);
                sauzen.push(s.nextElementSibling.innerText);
            });

            totalPrice += prijs;

            const li = document.createElement("li");
            li.className = "cart-item";
            li.dataset.id = id;
            li.dataset.naam = naam;
            li.dataset.prijs = prijs;

            li.dataset.extra = JSON.stringify({
                groenten,
                sauzen,
                opmerking
            });

            const basis = parseFloat(currentBroodje.dataset.prijs).toFixed(2);

            li.innerHTML = `
                <div>
                    <strong>${currentBroodje.dataset.naam}</strong>
                    <div class="cart-details">
                        Basis: €${basis}<br>
                        Groenten: ${groenten.length ? groenten.join(", ") : "-"}<br>
                        Sauzen: ${sauzen.length ? sauzen.join(", ") : "-"}

                        ${opmerking ? `<br>Opmerking: ${opmerking}` : ""}
                    </div>
                </div>

                <div class="cart-right">
                    €${prijs.toFixed(2)}
                    <button class="delete-btn" onclick="removeItem(this)">🗑</button>
                </div>`;
            document.getElementById("orderList").appendChild(li);
            document.getElementById("total").innerText = totalPrice.toFixed(2);

            closePopup();
        }

        //kan je items verwijderen uit je winkelmandje
        function removeItem(btn) {
            const item = btn.closest(".cart-item");
            totalPrice -= parseFloat(item.dataset.prijs);
            item.remove();
            document.getElementById("total").innerText = totalPrice.toFixed(2);
        }

        //sluit de popup
        function closePopup() {
            document.getElementById("popup").style.display = "none";
            document.getElementById("overlay").style.display = "none";
        }

        //zorgt ervoor dat de menukaart er goed uitziet
        function renderBroodjes() {

            const container = document.getElementById("broodjesContainer");
            container.innerHTML = "";

            if (!Array.isArray(broodjesData)) return;

            //filter eerst op categorie indien nodig
            let filtered = broodjesData.filter(b => {
                if (selectedCategorie === "all") return true;
                return String(b.categorieen_id) === String(selectedCategorie);
            });

            //groepeer per categorie
            const grouped = {};

            filtered.forEach(b => {
                const cat = b.categorieen_id || "onbekend";

                if (!grouped[cat]) {
                    grouped[cat] = [];
                }

                grouped[cat].push(b);
            });

            //render per categorie
            Object.keys(grouped).forEach(catId => {

                const catNaam = getCategorieNaam(catId);

                const title = document.createElement("h3");
                title.className = "category-title";
                title.innerText = catNaam;

                container.appendChild(title);
                title.innerText = catNaam;
                title.style.marginTop = "20px";


                grouped[catId].forEach(b => {

                    const div = document.createElement("div");
                    div.className = "broodje";

                    div.dataset.naam = b.naam;
                    div.dataset.prijs = b.prijs;
                    div.dataset.id = b.id;
                    div.dataset.categorie = b.categorieen_id;

                    div.innerHTML = `
                    <div class="broodje-top">
                        <span class="titel">${b.naam}</span>
                        <span class="prijs">€${parseFloat(b.prijs).toFixed(2)}</span>
                    </div>
                    <div class="beschrijving">${b.beschrijving || ""}</div>
                    <button onclick="openPopup(this)">Toevoegen</button>`;

                    container.appendChild(div);
                });
            });
        }

        function getCategorieNaam(id) {

            console.log("lookup id:", id);
            console.log("categorieenData:", categorieenData);

            const cat = categorieenData.find(c => String(c.id) === String(id));

            return cat ? cat.naam : "Onbekend";
        }

        Promise.all([
            fetch("http://localhost:3000/broodjes").then(r => r.json()),
            fetch("http://localhost:3000/categorieen").then(r => r.json())
        ]).then(([broodjes, categorieen]) => {

            broodjesData = broodjes;
            categorieenData = categorieen;

            console.log("READY STATE:", broodjesData, categorieenData);

            renderBroodjes();
        });

        //plaats de bestelling en komt dan op de stripe pagina
        function placeOrder() {

            const name = document.getElementById("customerName").value.trim();
            if (!name) return alert("Naam invullen!");

            const items = [];

            document.querySelectorAll("#orderList li").forEach(li => {

                const extra = JSON.parse(li.dataset.extra || "{}");

                items.push({
                    id: parseInt(li.dataset.id),
                    naam: li.dataset.naam,
                    prijs: parseFloat(li.dataset.prijs) || 0,
                    aantal: 1,

                    groenten: extra.groenten || [],
                    sauzen: extra.sauzen || [],
                    opmerking: extra.opmerking || ""
                });
            });

            if (items.length === 0) {
                return alert("Winkelmandje is leeg!");
            }

            fetch("http://localhost:3000/checkout", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    naam: name,
                    items: items,
                    totale_prijs: totalPrice,
                    betaalmethode: "card"
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.url) {
                        window.location.href = data.url;
                    } else {
                        alert("Betaling mislukt");
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Server error bij checkout");
                });
        }

    </script>

</body>

</html>
